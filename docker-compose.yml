services:
  db:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_USER: arogya
      POSTGRES_PASSWORD: arogya_dev_pw
      POSTGRES_DB: arogya
    ports:
      # Host side moved off the Postgres default — a native Postgres
      # install (common on Windows, e.g. from another project) binds 5432
      # first, at boot, before Docker Desktop starts, silently shadowing
      # this container: the app then talks to the wrong Postgres with the
      # wrong credentials, which just looks like a password error. The
      # container's own port stays 5432, only the host mapping changes.
      - "55432:5432"
    volumes:
      - arogya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arogya -d arogya"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  arogya_pgdata:
