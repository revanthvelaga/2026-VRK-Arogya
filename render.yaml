# Render Blueprint — deploys apps/api (a free web service) and
# apps/admin-web + apps/customer-web (free static sites) so the whole
# app — API, admin console, and customer site — is reachable from a
# browser without anything running locally.
# In the Render dashboard: New > Blueprint > connect this repo. Render
# reads this file automatically; you'll be prompted for the "sync: false"
# values during setup (DATABASE_URL, the two Razorpay keys if you want
# payments to work, and each web app's own API URL). JWT secrets are
# generated for you.
#
# The database itself isn't defined here — Render's own free Postgres
# doesn't support enabling the PostGIS extension this app needs (a
# permissions restriction on their free tier), so the database is a
# separate, free Supabase project instead. See docs/step-11-cloud-deploy.md
# for the full walkthrough, including enabling PostGIS on Supabase and
# where to find its connection string.
services:
  - type: web
    name: arogya-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /health
    envVars:
      # Paste Supabase's Session pooler connection string here (its
      # dashboard's "Connect" button — Session pooler, not Direct
      # connection, since Direct needs IPv6 and Render's free tier is
      # IPv4-only outbound). The API falls back to DB_HOST/DB_PORT/etc.
      # (local dev only) when this is unset.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Optional — leave blank to skip payments for now; every other
      # feature works without these. dashboard.razorpay.com, Test Mode,
      # Settings > API Keys.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Optional — powers prescription reading, the test finder, and the
      # AI report/health explanations. Leave blank to skip them (everything
      # else still works). Genuinely free, no card required:
      # aistudio.google.com/apikey > Create API key.
      - key: GEMINI_API_KEY
        sync: false
      # Optional automatic backups when Gemini is busy/down (text features
      # only — prescription photos always use Gemini). Each switches on
      # only if set. Free, no card: openrouter.ai/keys (DeepSeek, Llama,
      # Qwen free models) and console.groq.com/keys. Perplexity is paid
      # (API credits) — only add it if you want to pay for it.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      # Optional — enables "Sign in with Google" on the customer site.
      # Neither of these is a secret (no client secret is used — Google
      # Identity Services hands back an ID token directly), but they're
      # still per-project, so: console.cloud.google.com > APIs & Services
      # > Credentials > Create OAuth client ID > Web application. This
      # value must match VITE_GOOGLE_CLIENT_ID on arogya-customer-web.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Optional — enables mobile OTP sign-in via Firebase Phone Auth.
      # Also not a secret (ID-token verification only needs the public
      # project id, checked against Google's own public keys — no
      # service account file needed). Create a free project at
      # console.firebase.google.com, enable Authentication > Sign-in
      # method > Phone, and copy the project id from Project settings.
      # Must match VITE_FIREBASE_PROJECT_ID on arogya-customer-web.
      - key: FIREBASE_PROJECT_ID
        sync: false

  - type: web
    name: arogya-admin-web
    runtime: static
    rootDir: apps/admin-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Client-side routing (React Router) — any path that isn't a real
    # file falls back to index.html so a direct link to e.g.
    # /bookings/:id doesn't 404 on refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The arogya-api service's own URL, copied from its Render page
      # once it's deployed (e.g. https://arogya-api-xxxx.onrender.com) —
      # baked into the built JS at build time, so it must be set before
      # this service deploys.
      - key: VITE_API_URL
        sync: false
      # Optional — "Forgot password?" by phone OTP on the staff login.
      # Same public Firebase web config values as arogya-customer-web.
      # Leave blank and that page just tells agents to ask their admin.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false

  - type: web
    name: arogya-customer-web
    runtime: static
    rootDir: apps/customer-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      # Optional — E.164 format (e.g. +911234567890). Leave blank and
      # the "Book via Call"/"Book via WhatsApp" tiles are hidden.
      - key: VITE_SUPPORT_PHONE
        sync: false
      # Optional — "Sign in with Google" / mobile OTP on the login page.
      # None of these four are secrets (see the matching comments on
      # arogya-api above) — they're the public web config Firebase/Google
      # hand you when you create the project. Leave all four blank and
      # the login page works exactly as before (phone + password only).
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
