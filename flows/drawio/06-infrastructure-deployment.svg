  <rect x="420" y="170" width="460" height="70" rx="8" ry="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" /><text font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#7c1f1a" text-anchor="middle"><tspan x="650.0" y="193.0">Firewall / Security Group</tspan><tspan x="650.0" y="209.0">Inbound allowed: 443 (HTTPS) only</tspan><tspan x="650.0" y="225.0">80 → 443 redirect, everything else blocked</tspan></text>
