  <text x="40" y="31.0" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#111111" text-anchor="start">Auth module — request trace (URI → Guard → DTO → Controller → Service → Repository/DAO → Entity/POJO → Response)</text>
